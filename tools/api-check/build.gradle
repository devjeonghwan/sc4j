plugins {
    id 'java-library'
    id 'org.fogofwarlabs.sc4j.java'
}

// The API tools of the engine (docs/api-policy.md): the public API listing of an engine module over the JDK's javap (apiDump, apiCheck),
// without the elements annotated ApiStatus.Internal. The root build runs them as JavaExec tasks; no dependency beyond the JDK and the engine
// base.
dependencies {
    implementation project(':sc4j-base')
}
