plugins {
    id 'base'
}

// Packaging of the SC:R mod: mods/scr.jar from the classes and resources of every mods/scr module (the benchmark module,
// JMH only, is not part of the mod), and its copy into the development install. The build rules of the SC:R side come first: native
// libraries, test tiers, the internal use check and the native id boundary.

// The renderer and the client stage native libraries (configureNativeLibraries of the root project). Their build files fill the
// configuration, so it is created before they are evaluated.
['scr-render', 'scr-client'].each { name ->
    rootProject.configureNativeLibraries(project(':mods:scr:' + name))
}

// External test inputs, passed as Gradle properties (-P<name>=<path>, or <name>=<path> in the user's
// GRADLE_USER_HOME/gradle.properties) and forwarded as system properties. The shared test fixture
// org.fogofwarlabs.sc4j.scr.core.test.ExternalInput reads them.
def externalTestProperties = [
    'sc4j.data',                  // SC:R installation (CASC storage, Maps, x86_64/StarCraft.exe)
    'sc4j.replays',               // STARDATA replay corpus root (stardata_original_replays)
    'sc4j.replays.limit',         // corpus file limit of the replay parse test
    'sc4j.maps',                  // the client's maps folder with the large EUD maps (mods/scr/scr-client/build/install/sc4j/maps)
    'sc4j.corpus'                 // replay corpus folder that the corpus survey plays (any folder layout)
]

// The integration tier needs the SC:R installation: fail before any task runs instead of skipping every test.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { task -> task.name == 'integrationTest' }) {
        def data = providers.gradleProperty('sc4j.data').getOrElse('')

        if (data.isBlank()) {
            throw new GradleException("integrationTest needs the SC:R installation: set the Gradle property sc4j.data, either as the line " +
                                      "'sc4j.data=<installation directory>' in %USERPROFILE%\\.gradle\\gradle.properties (GRADLE_USER_HOME) " +
                                      "or with -Psc4j.data=<installation directory> (CI: ORG_GRADLE_PROJECT_sc4j.data).")
        }

        if (!new File(data).isDirectory()) {
            throw new GradleException("integrationTest needs the SC:R installation, but the Gradle property sc4j.data names no directory: " + data)
        }
    }
}

// The test tiers of every mods/scr module (the recorder mods/scr/sc-recorder included) and of demo 2 (mods/scr-demo). The unit tier (test)
// leaves out the tags integration and corpus (root project).
configure(subprojects + [project(':mods:scr-demo')]) { module ->
    module.plugins.withType(JavaLibraryPlugin).configureEach {
        // The external properties are forwarded blank to the unit tier so a -P value never turns it into an external run.
        def unitTest = module.tasks.named('test') {
            externalTestProperties.each { name -> systemProperty name, '' }
        }

        // Integration tier: the tests marked @RequiresInstallation (tag integration), with the SC:R installation sc4j.data.
        // The build fails before it starts when sc4j.data is not set (gradle.taskGraph.whenReady above).
        def integrationTest = module.tasks.register('integrationTest', Test) {
            description = 'Runs the integration tier: the tests that need the SC:R installation (sc4j.data).'
            group = 'verification'
            testClassesDirs = module.sourceSets.test.output.classesDirs
            classpath = module.sourceSets.test.runtimeClasspath
            useJUnitPlatform {
                includeTags 'integration'
                excludeTags 'corpus'
            }
            shouldRunAfter unitTest
        }

        // Corpus tier: the tests marked @CorpusTest (tag corpus): long runs and tests over the external folders other than
        // the installation. A test whose declared folder is not set is skipped.
        def corpusTest = module.tasks.register('corpusTest', Test) {
            description = 'Runs the corpus tier over the external replay corpus and the other external folders.'
            group = 'verification'
            testClassesDirs = module.sourceSets.test.output.classesDirs
            classpath = module.sourceSets.test.runtimeClasspath
            useJUnitPlatform {
                includeTags 'corpus'
            }
            shouldRunAfter integrationTest
        }

        [integrationTest, corpusTest].each { task ->
            task.configure {
                externalTestProperties.each { name -> systemProperty name, providers.gradleProperty(name).getOrElse('') }
                // Changed external inputs must rerun the tier.
                outputs.upToDateWhen { false }
            }
        }

        // The folder-driven tests (replays/detection, replays/native, maps, captures/lan, ... of the test resources) write one
        // result table per test task (org.fogofwarlabs.sc4j.scr.core.test.TestResultUtils).
        [unitTest, integrationTest, corpusTest].each { task ->
            task.configure {
                systemProperty 'sc4j.golden.results', module.layout.buildDirectory.dir('golden-results/' + task.name).get().asFile.absolutePath
            }
        }
    }
}

// The internal use check of the root project over the main sources of every mods/scr module but the recorder and the demo 2 classes of
// mods/scr-demo (its clone is the SC:R mod's sources).
(subprojects - project(':mods:scr:sc-recorder')).each { module ->
    rootProject.configureApiUse(module, 'src/main/java')
}
rootProject.configureApiUse(project(':mods:scr-demo'), 'src/mod/java')

// Native id boundary: the SC:R mod keeps its native ids as the int holders of scr.content (ScrUnitIds ...) and
// the engine identities of ScrUnits ... mapped by ScrNativeIds; the package scr.data.type.constant declares no enum and no source names
// a native id enum (UnitType, WeaponType, UpgradeType, TechType, OrderType, Race) in that package. "check" (and so "build")
// runs it for every module of the SC:R mod and the recorder.
def nativeIdEnumPattern = ~/org[.\/]fogofwarlabs[.\/]sc4j[.\/]scr[.\/]data[.\/]type[.\/]constant[.\/](UnitType|WeaponType|UpgradeType|TechType|OrderType|Race)\b/
def constantPackage = 'org/fogofwarlabs/sc4j/scr/data/type/constant/'

configure(subprojects) { module ->
    def sourceFiles = module.fileTree(module.file('src')) { include '**/*.java' }
    def report = module.layout.buildDirectory.file('reports/native-id-boundary.txt')
    def checkNativeIdBoundary = module.tasks.register('checkNativeIdBoundary') {
        description = 'Checks that no native id enum of scr.data.type.constant is declared or named; the native ids are the scr.content holders.'
        group = 'verification'
        inputs.files(sourceFiles)
        outputs.file(report)
        doLast {
            def problems = []
            sourceFiles.each { file ->
                def constant = file.path.replace('\\', '/').contains(constantPackage)
                file.readLines('UTF-8').eachWithIndex { line, index ->
                    if (line =~ nativeIdEnumPattern || constant && line =~ /^\s*(public\s+)?enum\s/) {
                        problems << file.path + ':' + (index + 1) + ': ' + line.trim()
                    }
                }
            }
            if (!problems.isEmpty()) {
                throw new GradleException(module.path + ' must not declare or name a native id enum of scr.data.type.constant:\n  ' +
                        problems.join('\n  '))
            }
            report.get().asFile.text = 'No native id enum: ' + sourceFiles.files.size() + ' files checked.\n'
        }
    }
    module.plugins.withId('java') {
        module.tasks.named('check') {
            dependsOn checkNativeIdBoundary
        }
    }
}

evaluationDependsOnChildren()

// The module folders of the mod and their compiler arguments (mod.properties); the clone of demo 2 (mods/scr-demo) reads the same file.
def modProperties = new Properties()
file('mod.properties').withReader('UTF-8') { reader -> modProperties.load(reader) }
def modModuleNames = modProperties.getProperty('modules').split(',').toList()
def modModules = modModuleNames.collect { name -> project(':mods:scr:' + name) }

// -parameters records the parameter names in the class files: javac names the constructor parameters of an anonymous class after those of
// its superclass's constructor, which it knows from a class file only when they are recorded there. Without it a class compiled against the
// class file of its superclass (another module, or an incremental compile) gets other bytes than when both are compiled together.
def modCompilerArgs = modProperties.getProperty('compilerArgs').split(' ').toList()
modModules.each { module ->
    module.tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += modCompilerArgs
    }
}

// The mod jar: sc4j-mod.json and meta/ come from the scr-client resources. The engine, the manifest module and the base are
// not in it, and neither are the third-party libraries: the runtime provides them.
def modJar = tasks.register('modJar', Jar) {
    description = 'Builds the SC:R mod jar scr.jar from the mods/scr modules.'
    group = 'build'
    archiveFileName = 'scr.jar'
    destinationDirectory = layout.buildDirectory.dir('mods')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
    modModules.each { module -> from(module.sourceSets.main.output) }
    doLast {
        rootProject.checkJarLicenses(archiveFile.get().asFile)
    }
}

tasks.named('assemble') {
    dependsOn modJar
}

// scr.jar as the variant of this project with the usage sc4j-mod-jar.
configurations.consumable('modJarElements') {
    attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, 'sc4j-mod-jar'))
    outgoing.artifact(modJar)
}

// The development install (gradlew :mods:scr:devInstall): the root project's devInstall assembles build/dev-install, then scr.jar is
// copied into its mods/ folder. When the Gradle property sc4j.data names the SC:R installation and no shared settings file exists yet,
// userdata/shared-settings.json is created with it as the value of the shared StarCraft: Remastered folder setting (shared name
// starcraft-remastered) of the SC:R mod and its clones.
def engineDevInstall = rootProject.tasks.named('devInstall')
tasks.register('devInstall', Copy) {
    description = 'Copies scr.jar into the mods folder of the development install build/dev-install.'
    group = 'distribution'
    dependsOn engineDevInstall
    into engineDevInstall.map { task -> task.destinationDir }
    from(modJar) { into 'mods' }

    def installation = providers.gradleProperty('sc4j.data').getOrElse('')
    doLast {
        def sharedSettingsFile = new File(destinationDir, 'userdata/shared-settings.json')
        if (!installation.isBlank() && !sharedSettingsFile.exists()) {
            sharedSettingsFile.parentFile.mkdirs()
            def value = new File(installation).absolutePath.replace('\\', '\\\\').replace('"', '\\"')
            sharedSettingsFile.setText('{\n  "format": 1,\n  "values": {"starcraft-remastered": "' + value + '"}\n}\n', 'UTF-8')
        }
    }
}
